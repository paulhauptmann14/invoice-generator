# Self-hosted stack: Postgres, GoTrue, PostgREST, Storage, the app and Caddy.
# Run it through scripts/setup and scripts/update, which supply --env-file and --project-directory.
# Only Caddy publishes ports; Caddy is also the internal Supabase gateway on http://caddy:8000.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    volumes:
      - db-data:/var/lib/postgresql/data
      # Persists the pgsodium key directory between restarts (as upstream)
      - db-config:/etc/postgresql-custom
      # First-start init (upstream scripts): service role passwords and JWT lifetime
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    # Warnings and errors stay in the log (disk full, crash recovery). Failed statements can contain secrets as literals, so
    # statement text stays out (log_min_error_statement) and so do DETAIL/HINT/CONTEXT lines (terse); the client still sees the error.
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=warning, -c, log_min_error_statement=fatal, -c, log_error_verbosity=terse]
    # The image stops Postgres with SIGINT (fast shutdown); give it time to checkpoint before Docker kills it (crash recovery on an SD card is slow).
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://caddy:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?}@db:5432/postgres
      GOTRUE_SITE_URL: https://${APP_HOST:?}
      # Sign-ups are allowed only with REGISTRATION=on (derived in the command below, so one switch rules app and auth)
      REGISTRATION: ${REGISTRATION:-off}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # No mail server in the home network: addresses count as confirmed, there are no e-mail flows
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
    command:
      - sh
      - -c
      - 'if [ "$$REGISTRATION" = on ]; then GOTRUE_DISABLE_SIGNUP=false; else GOTRUE_DISABLE_SIGNUP=true; fi; export GOTRUE_DISABLE_SIGNUP; exec auth'
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://127.0.0.1:9999/health']
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: supabase/storage-api:v1.81.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    volumes:
      - storage-data:/var/lib/storage
    environment:
      ANON_KEY: ${ANON_KEY:?}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET:?}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:?}@db:5432/postgres
      STORAGE_PUBLIC_URL: http://caddy:8000
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      # Single-tenant mode: these three are required placeholders, not real S3 settings
      GLOBAL_S3_BUCKET: stub
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://127.0.0.1:5000/status']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: ../..
      dockerfile: deploy/self-hosted/app.Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://caddy:8000
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY:?}
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    depends_on:
      caddy:
        condition: service_started
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://caddy:8000
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY:?}
      PASSWORD_RESET_EMAIL: 'off'
      REGISTRATION: ${REGISTRATION:-off}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      # The directory, not the single file: git replaces the file on pull, and a file mount would keep showing the old inode
      # (scripts/update reloads Caddy after every update).
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      APP_HOST: ${APP_HOST:?}
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  db-config:
  storage-data:
  caddy-data:
  caddy-config:
